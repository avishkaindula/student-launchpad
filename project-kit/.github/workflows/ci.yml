# CI for a Node.js / Next.js project using pnpm.
# Remove steps your project doesn't have (e.g. typecheck or test) — or better, add those scripts.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json
      # (add it with: corepack use pnpm@latest) — or set `with: version: 10`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Add placeholder values for env vars your build needs. Real secrets go in
          # Settings → Secrets and variables → Actions, referenced as ${{ secrets.NAME }}.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
